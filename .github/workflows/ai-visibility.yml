name: AI Visibility weekly

# Every Monday: ask the free AI models our tracked questions, read competitor sitemaps,
# check AI readiness, pull Search Console, and suggest new questions.
# Uses the same repository secrets as the ABM sender: ABM_BASE_URL and CRON_SECRET.

on:
  schedule:
    - cron: '30 2 * * 1'   # Monday 02:30 UTC = 08:00 IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run all steps
        env:
          BASE: ${{ secrets.ABM_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ] || [ -z "$SECRET" ]; then echo "ABM_BASE_URL / CRON_SECRET secrets are not set"; exit 1; fi
          call() { curl -sS -m 90 -H "Authorization: Bearer $SECRET" "$BASE/api/ai-visibility/cron?step=$1"; }
          loop() {
            for i in $(seq 1 120); do
              out=$(call "$1"); echo "$1 #$i: $out"
              echo "$out" | grep -q '"done":true' && return 0
              echo "$out" | grep -q '"error"' && return 0
              echo "$out" | grep -q 'rate limited' && sleep 30
            done
          }
          loop ask
          loop sites
          echo "readiness: $(call readiness)"
          echo "gsc: $(call gsc)"
          echo "suggest: $(call suggest)"
